<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>正在打开…</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0f1115;color:#c8ccd4;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .box{text-align:center;padding:24px;max-width:340px}
  .sp{width:34px;height:34px;margin:0 auto 16px;border:3px solid #2a2f3a;border-top-color:#7aa2ff;
      border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .t{font-size:15px;line-height:1.7}
  .s{font-size:12.5px;color:#7b8291;margin-top:8px}
  .err{display:none}
  .wx{display:none;font-size:14px;line-height:1.8}
  .wx b{color:#ffcf5c}
  a{color:#7aa2ff;text-decoration:none}
  .lines{display:none;margin-top:18px;text-align:left}
  .lines .lh{font-size:12.5px;color:#7b8291;margin-bottom:8px;text-align:center}
  .lines a{display:block;padding:10px 14px;margin-top:8px;border-radius:10px;background:#1a1e27;
           border:1px solid #2a2f3a;color:#c8ccd4;font-size:14px}
  .lines a b{float:right;font-weight:normal;color:#7aa2ff}
  .lines a.ok b{color:#5bd68a}
  .lines .rt{text-align:center;background:none;border:0;color:#7aa2ff}
</style>
</head>
<body>
<div class="box">
  <div id="loading">
    <div class="sp"></div>
    <div class="t">正在为你打开，请稍候…</div>
    <div class="s" id="tip">正在选择最快线路</div>
  </div>
  <div class="err" id="error">
    <div class="t">暂时打不开 😥</div>
    <div class="s" id="emsg">请稍后重试，或用手机浏览器重新打开本链接。</div>
  </div>
  <div class="lines" id="lines"></div>
  <div class="wx" id="wx">
    请点右上角 <b>「···」</b> → 选择 <b>「在浏览器打开」</b><br>再继续下载。
  </div>
</div>
<script>
(function(){
  "use strict";
  var FILE_SOURCES = ["https://cdn.jsdelivr.net/gh/npskle/assets@8d1ce55c8a3b85c7bd8c63f20e22dd98f91d7e21/d.txt","https://fastly.jsdelivr.net/gh/npskle/assets@8d1ce55c8a3b85c7bd8c63f20e22dd98f91d7e21/d.txt","https://gcore.jsdelivr.net/gh/npskle/assets@8d1ce55c8a3b85c7bd8c63f20e22dd98f91d7e21/d.txt","https://cdn.statically.io/gh/npskle/assets@8d1ce55c8a3b85c7bd8c63f20e22dd98f91d7e21/d.txt","https://gitlab.com/api/v4/projects/kle-group3%2Fassets/repository/files/d.txt/raw?ref=main"];
  var DOH_TXT = ["https://dns.alidns.com/resolve?name=s.fbstudy.wiki\u0026type=TXT"];
  var KEY_HEX = "7127fe3cb8ef5bea708306ee7ae109f3c121aad09590f27e3bcdc07e1b255b54";
  var PROBE_PATH = "/probe.png";
  var PROBE_TIMEOUT = 4000, SOURCE_TIMEOUT = 6000;

  var loadingEl=document.getElementById("loading"), errorEl=document.getElementById("error"),
      tipEl=document.getElementById("tip"), emsgEl=document.getElementById("emsg"), wxEl=document.getElementById("wx");
  function isWeChat(){ return /MicroMessenger/i.test(navigator.userAgent||""); }
  function toUrl(d){ d=String(d||"").replace(/\s+/g,""); if(!/^https?:\/\//i.test(d)) d="https://"+d; return d.replace(/\/+$/,""); }
  function target(domain){ return toUrl(domain)+location.pathname+location.search+location.hash; }
  function redirect(domain){ location.replace(target(domain)); }
  function onAttempt(n){ tipEl.textContent = n>1 ? "线路较慢，正在换一条…" : "正在打开…"; }
  function showErr(msg){ stopAuto(); loadingEl.style.display="none"; errorEl.style.display="block"; if(msg) emsgEl.textContent=msg; }
  function withTimeout(p,ms){ return new Promise(function(res,rej){ var t=setTimeout(function(){rej(new Error("timeout"));},ms);
      p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);}); }); }
  function hexToBytes(h){ var a=new Uint8Array(h.length/2); for(var i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
  function b64ToBytes(s){ s=s.replace(/\s+/g,""); var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  function decrypt(b64){
    var raw=b64ToBytes(b64); if(raw.length<28) return Promise.reject(new Error("short"));
    var iv=raw.slice(0,12), data=raw.slice(12);
    return crypto.subtle.importKey("raw",hexToBytes(KEY_HEX),{name:"AES-GCM"},false,["decrypt"])
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},k,data); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function fromFile(url){
    return withTimeout(fetch(url,{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("http"); return r.text(); })
      .then(decrypt).then(pickDomains), SOURCE_TIMEOUT);
  }
  function fromDoh(url){
    return withTimeout(fetch(url,{headers:{accept:"application/dns-json"},cache:"no-store"}).then(function(r){return r.json();})
      .then(function(j){
        // 分片记录 v=1;i=<序号>;n=<总数>;d=<base64>。值按「第一个 =」切（base64 末尾的 == 不能丢，
        // 2026-11-12 前按 split("=") 只收两段，带 == 的最后一片总被丢、TXT 源从没解成功过）；
        // 容错长记录被拆成多段字符串、以及手工更新时前面多粘了内容（只认 v=1; 起的部分）。
        var ans=(j&&j.Answer)||[], parts={}, total=0;
        for(var i=0;i<ans.length;i++){
          var t=String(ans[i].data||"").replace(/"\s*"/g,"").replace(/"/g,"");
          var at=t.indexOf("v=1;"); if(at<0) continue;
          t=t.slice(at).replace(/\s+/g,"");
          var kv={}; t.split(";").forEach(function(x){ var p=x.indexOf("="); if(p>0) kv[x.slice(0,p)]=x.slice(p+1); });
          if(kv.n) total=parseInt(kv.n,10)||total;
          if(kv.d!==undefined) parts[parseInt(kv.i||"0",10)]=kv.d; }
        var keys=Object.keys(parts).sort(function(a,b){return a-b;}), b64="";
        if(total>0 && keys.length!==total) throw new Error("txt-incomplete");
        for(var k=0;k<keys.length;k++) b64+=parts[keys[k]];
        if(!b64) throw new Error("no-txt"); return decrypt(b64);
      }).then(pickDomains), SOURCE_TIMEOUT);
  }
  function pickDomains(j){
    if(!j) throw new Error("empty");
    var list = j.dl || j.domestic || j.overseas || [];
    var out=[], seen={};
    for(var i=0;i<list.length;i++){ var d=String(list[i]||"").replace(/\s+/g,""); if(d&&!seen[d]){seen[d]=1;out.push(d);} }
    if(!out.length) throw new Error("no-domain");
    out.ts=+j.ts||0; // 生成时间（秒），用来丢掉旧清单
    return out;
  }
  function probe(domain){
    return new Promise(function(res,rej){
      var img=new Image(), done=false;
      var t=setTimeout(function(){ if(!done){done=true;img.src="";rej();} },PROBE_TIMEOUT);
      img.onload=function(){ if(!done){done=true;clearTimeout(t);res(domain);} };
      img.onerror=function(){ if(!done){done=true;clearTimeout(t);rej();} };
      img.src=toUrl(domain)+PROBE_PATH+"?_="+Date.now();
    });
  }
  // —— 逐条尝试 + 跳转看门（2026-11-16）——
  // 探活图通 ≠ 页面能打开：发布页域名的 DNS 会在几组节点 IP 间轮换，浏览器又按顶层站点分隔连接和
  // DNS 缓存，入口页里探活连上的节点，真正跳过去时可能换成另一组连不上的节点（11-16 实测 jfcwtmyp.cc
  // 探活 1 秒通，跳过去首页一直无响应，以前的入口页跳出去就不管了）。新页面响应之前本页脚本仍在跑，
  // 所以跳出去后继续看门：NAV_TIMEOUT 内本页还在，就中止这次跳转、换下一条探活通过的域名；
  // 全部用完就列出线路让用户手动选 —— 不再盲跳清单第一个。
  var NAV_TIMEOUT = 7000, LINES_AFTER = 12000;
  var tried={}, okSet={}, allDomains=[], navTimer=null, stopped=false, attempts=0;
  function prober(domains){
    var ok=[], left=domains.length, waiters=[];
    function take(){ for(var i=0;i<ok.length;i++){ if(!tried[ok[i]]) return ok[i]; } return null; }
    function flush(){
      while(waiters.length){ var d=take();
        if(d){ tried[d]=1; waiters.shift().res(d); } else if(left<=0){ waiters.shift().rej(); } else break; }
    }
    domains.forEach(function(d){ probe(d).then(function(){ okSet[d]=1; ok.push(d); left--; flush(); },
      function(){ left--; flush(); }); });
    return function(){ return new Promise(function(res,rej){ waiters.push({res:res,rej:rej}); flush(); }); };
  }
  function stopAuto(){ stopped=true; clearTimeout(navTimer); }
  function tryNext(next){
    next().then(function(d){
      if(stopped) return;
      attempts++; onAttempt(attempts);
      redirect(d);
      navTimer=setTimeout(function(){ if(stopped) return; try{ window.stop(); }catch(e){} tryNext(next); }, NAV_TIMEOUT);
    }, function(){
      if(stopped) return;
      showErr(attempts ? "自动选的线路都没能打开，请手动选一条：" : "线路检测都没通过，可以手动选一条试试：");
      showLines();
    });
  }
  function showLines(){
    if(!allDomains.length) return;
    var box=document.getElementById("lines"); box.innerHTML="";
    if(errorEl.style.display!=="block"){ // 报错时错误文案已经说了，不再重复
      var h=document.createElement("div"); h.className="lh"; h.textContent="还没打开？可以手动选一条线路"; box.appendChild(h); }
    var list=allDomains.filter(function(d){ return okSet[d]; }).concat(allDomains.filter(function(d){ return !okSet[d]; }));
    list.forEach(function(d,i){
      var a=document.createElement("a"); a.href=target(d); a.className=okSet[d]?"ok":"";
      a.appendChild(document.createTextNode("线路 "+(i+1)));
      var b=document.createElement("b"); b.textContent=okSet[d]?"检测可用":"检测未通过"; a.appendChild(b);
      a.onclick=stopAuto;
      box.appendChild(a);
    });
    var r=document.createElement("a"); r.className="rt"; r.href="javascript:location.reload()"; r.textContent="重新检测";
    box.appendChild(r); box.style.display="block";
  }
  // 从后面的页面退回来（bfcache 恢复）时冻结的计时器会接着跑，不能再自动跳走，改为让用户选。
  window.addEventListener("pageshow",function(e){ if(e.persisted){ stopAuto(); showErr("可以手动选一条线路："); showLines(); } });
  // 只用「最新」的清单（2026-11-17）：每份清单都带生成时间 ts，capMs 内收到的里只取 ts 最大的那几份
  // 取并集。以前所有源无条件取并集：只能手动改的 DNS TXT 一旦没跟上，被换下的旧发布页（服务还活着、
  // 探活能过，却已被 Google 标红）就混进候选，用户被随机带到红页。旧清单一律不参与。
  function newestOf(promises, capMs){
    return new Promise(function(res,rej){
      var best=-1, out=[], seen={}, settled=0, done=false;
      function finish(){ if(done) return; done=true; out.length?res(out):rej(); }
      if(!promises.length) return rej();
      var cap=setTimeout(finish, capMs);
      function one(){ if(++settled===promises.length){ clearTimeout(cap); finish(); } }
      promises.forEach(function(p){ Promise.resolve(p).then(function(list){
        if(done||!list||!list.length){ one(); return; }
        var ts=list.ts||0;
        if(ts>best){ best=ts; out=[]; seen={}; }
        if(ts===best){ for(var i=0;i<list.length;i++){ var d=list[i]; if(d&&!seen[d]){seen[d]=1;out.push(d);} } }
        one();
      }, one); });
    });
  }
  // 文件源（GitHub/jsDelivr 钉提交号、GitLab API）每次换域名都自动推送，是唯一可信来源；
  // DNS TXT 只能手动改、常常落后，只在文件源全部拿不到时兜底。
  function discover(){
    var files=FILE_SOURCES.map(fromFile), txts=DOH_TXT.map(fromDoh); // 同时发出，兜底时 TXT 多半已到
    return newestOf(files, 3500)
      .catch(function(){ return newestOf(files, 2500); }) // 文件源慢：再多等一会儿
      .catch(function(){ return newestOf(txts, 1500); });
  }
  function run(){
    if(isWeChat()){ loadingEl.style.display="none"; wxEl.style.display="block"; return; }
    if(!(window.crypto&&crypto.subtle&&window.fetch)){ showErr("请用手机自带浏览器打开本链接。"); return; }
    discover().then(function(domains){
      allDomains=domains;
      tipEl.textContent="正在选择最快线路…";
      tryNext(prober(domains));
    }, function(){ showErr("线路都在维护中，请稍后重试，或用浏览器重新打开本链接。"); });
    // 迟迟没打开：先把线路列出来让用户可以自己点，自动换线继续进行。
    setTimeout(function(){ if(!stopped&&wxEl.style.display!=="block") showLines(); }, LINES_AFTER);
  }
  run();
})();
</script>
</body>
</html>
